# Ender's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-ender
  namespace: argocd
spec:
  description: "Ender - ender - Klipper + Moonraker for the Ender-3 Max Neo 3D printer (USB on Bahamut)"
  sourceRepos:
    - https://git.clockmost.com/Meru/ender.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ender
    - server: https://kubernetes.default.svc
      namespace: ender-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: ender }
    - { group: "", kind: Namespace, name: ender-build }
