# Tanuki's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-tanuki
  namespace: argocd
spec:
  description: "Tanuki - Secrets test app - one typed, one generated secret"
  sourceRepos:
    - https://git.clockmost.com/Meru/tanuki.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: tanuki
    - server: https://kubernetes.default.svc
      namespace: tanuki-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: tanuki }
    - { group: "", kind: Namespace, name: tanuki-build }
