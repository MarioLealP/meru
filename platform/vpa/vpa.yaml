# Recommendation-only VPA objects for the platform's own controllers (the Application is platform/vpa.yaml).
# updateMode Off: the recommender writes status.recommendation and nothing else - nothing evicts or resizes a pod,
# and the Application installs no updater and no admission controller, so Off cannot be switched on by accident.
# Read the numbers with: kubectl get vpa -A  /  kubectl describe vpa <name> -n <ns>  (ssh clockmost-agent-read k8s).
# Targets that do not exist (yet) just show no recommendation.

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  targetRef: { apiVersion: apps/v1, kind: Deployment, name: cert-manager }
  updatePolicy: { updateMode: "Off" }

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager-cainjector
  namespace: cert-manager
spec:
