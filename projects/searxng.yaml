# Searxng's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-searxng
  namespace: argocd
spec:
  description: "Searxng - searxng - private metasearch for Felt's web_search skill, no UI, no route"
  sourceRepos:
    - https://git.clockmost.com/Meru/searxng.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: searxng
    - server: https://kubernetes.default.svc
      namespace: searxng-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: searxng }
    - { group: "", kind: Namespace, name: searxng-build }
