# Ntfy's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-ntfy
  namespace: argocd
spec:
  description: "Ntfy - ntfy - push notifications for clockmost's alerts and Felt's messages, to Mario's phone"
  sourceRepos:
    - https://git.clockmost.com/Meru/ntfy.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ntfy
    - server: https://kubernetes.default.svc
      namespace: ntfy-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: ntfy }
    - { group: "", kind: Namespace, name: ntfy-build }
