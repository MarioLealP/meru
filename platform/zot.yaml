# Zot: registry + pull-through mirror, from Meru/zot. Wave 0: after the rules exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zot
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://git.clockmost.com/Meru/zot.git # public; the LAN via cluster DNS
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: zot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
