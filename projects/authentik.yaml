# Authentik's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-authentik
  namespace: argocd
spec:
  description: "Authentik - authentik - single sign-on for every clockmost site, app and workload (forward-auth, OIDC, SAML)"
  sourceRepos:
    - https://git.clockmost.com/Meru/authentik.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: authentik
    - server: https://kubernetes.default.svc
      namespace: authentik-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: authentik }
    - { group: "", kind: Namespace, name: authentik-build }
