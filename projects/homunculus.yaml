# Homunculus's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-homunculus
  namespace: argocd
spec:
  description: "Homunculus - Test app - Xolotl's first hands-off onboarding and retirement"
  sourceRepos:
    - https://git.clockmost.com/Meru/homunculus.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: homunculus
    - server: https://kubernetes.default.svc
      namespace: homunculus-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: homunculus }
    - { group: "", kind: Namespace, name: homunculus-build }
