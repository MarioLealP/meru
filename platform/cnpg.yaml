# CloudNativePG: the Postgres operator. Each app that needs Postgres gets its own small `Cluster` (an app's
# deploy/database/, or a platform part's); CNPG creates, upgrades and restarts it. Wave 1: after the rules.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1 # CloudNativePG 1.30.1 (fixes every published advisory, incl. the 2026 criticals)
    helm:
      valuesObject:
        image:
          tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
        podLabels:
          app.kubernetes.io/part-of: meru
          meru.clockmost.com/owner: platform
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 512Mi }
        monitoring:
          podMonitorEnabled: false # no Prometheus; Postgres health goes to Zabbix later
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CNPG's CRDs are too big for client-side apply
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
