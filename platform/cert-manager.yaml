# cert-manager: issues and renews the in-cluster TLS certificates (D71). It holds no OpenBao login of its own: each
# app namespace's Issuer points it at OpenBao's pki_meru with that namespace's `certs` account, and OpenBao only signs
# names under <ns>.svc. No ACME, no cluster-wide issuer. Wave 1: after the rules. The controller has no readiness
# probe and the cainjector no probes at all in the chart - Meru/kyverno's cert-manager exception says why.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3 # latest (2026-10-23); GHSA-8rvj-mm4h-c258 fixed since 1.20.3
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
          keep: true # deleting the app never deletes every Certificate in the cluster
        enableCertificateOwnerRef: true # a deleted Certificate takes its Secret with it, like ESO's Owner (D68)
        podLabels: &labels
          app.kubernetes.io/part-of: meru
          meru.clockmost.com/owner: platform
        image:
          digest: sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
        resources:
          requests: { cpu: 10m, memory: 48Mi }
          limits: { memory: 192Mi }
        prometheus:
          enabled: false # no Prometheus here; Zabbix watches the pods
        webhook:
          podLabels: *labels
          image:
            digest: sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 96Mi }
        cainjector:
          podLabels: *labels
          image:
            digest: sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 192Mi }
        acmesolver:
          image:
            digest: sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7
        startupapicheck:
          enabled: false # a post-install Helm hook Job; Argo's health check covers it
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the CRDs are too big for client-side apply
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
