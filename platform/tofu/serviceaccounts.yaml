# tofu-runner: the runner pod's account. It needs no Kubernetes API access and no OpenBao login (every secret reaches
# it as a normal Secret, below), so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tofu-runner
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: meru
    meru.clockmost.com/owner: platform
automountServiceAccountToken: false
---
# eso: the identity ESO borrows to log in to OpenBao (role meru-tofu-eso, reads apps/meru/tofu/eso/* only); no pod runs as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: meru
    meru.clockmost.com/owner: platform
automountServiceAccountToken: false
---
# backup-key: the identity of the Garage key SecretStore below; it may read exactly Secret s3-tofu in namespace garage
# (Meru/meru rbac/garage-backup-keys.yaml). No pod runs as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-key
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: meru
    meru.clockmost.com/owner: platform
automountServiceAccountToken: false
