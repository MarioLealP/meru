# Caddy's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-caddy
  namespace: argocd
spec:
  description: "Caddy - caddy - our xcaddy build as a signed host binary for Bahamut's front door (nothing runs in k3s)"
  sourceRepos:
    - https://git.clockmost.com/Meru/caddy.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: caddy
    - server: https://kubernetes.default.svc
      namespace: caddy-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: caddy }
    - { group: "", kind: Namespace, name: caddy-build }
