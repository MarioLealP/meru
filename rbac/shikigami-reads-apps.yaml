# Shikigami may read Argo CD Applications (D85): its retire pass waits until Argo has applied an app's stop commit
# (synced, no workload left) before it parks the marker - with preserveResourcesOnDeletion, an Application removed
# before that would leave its pods running with nothing to stop them. Read only: get, no list/watch, no writes.
# Applications hold what's already in the public Meru repos (sources, sync status), no secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shikigami-reads-apps
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shikigami-reads-apps
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shikigami-reads-apps
subjects:
  - kind: ServiceAccount
    name: shikigami
    namespace: shikigami
