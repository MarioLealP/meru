# Obsidian's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-obsidian
  namespace: argocd
spec:
  description: "Obsidian - obsidian - CouchDB for Obsidian LiveSync, syncing Mario's vault between the desktop and the phone"
  sourceRepos:
    - https://git.clockmost.com/Meru/obsidian.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: obsidian
    - server: https://kubernetes.default.svc
      namespace: obsidian-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: obsidian }
    - { group: "", kind: Namespace, name: obsidian-build }
