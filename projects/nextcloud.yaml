# Nextcloud's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-nextcloud
  namespace: argocd
spec:
  description: "Nextcloud - nextcloud - files, calendar, contacts and office in the browser (Google/Microsoft replacement)"
  sourceRepos:
    - https://git.clockmost.com/Meru/nextcloud.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: nextcloud
    - server: https://kubernetes.default.svc
      namespace: nextcloud-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: nextcloud }
    - { group: "", kind: Namespace, name: nextcloud-build }
