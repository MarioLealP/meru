# Felt-core's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-felt-core
  namespace: argocd
spec:
  description: "Felt-core - felt-core - Felt's brain/API (skills, alarms, memory, HA agent), behind Caddy's felt sites"
  sourceRepos:
    - https://git.clockmost.com/Meru/felt-core.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: felt-core
    - server: https://kubernetes.default.svc
      namespace: felt-core-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: felt-core }
    - { group: "", kind: Namespace, name: felt-core-build }
