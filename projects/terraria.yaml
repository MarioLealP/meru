# Terraria's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-terraria
  namespace: argocd
spec:
  description: "Terraria - terraria - modded Terraria (tModLoader) server for Mario and friends, public game port"
  sourceRepos:
    - https://git.clockmost.com/Meru/terraria.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: terraria
    - server: https://kubernetes.default.svc
      namespace: terraria-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: terraria }
    - { group: "", kind: Namespace, name: terraria-build }
