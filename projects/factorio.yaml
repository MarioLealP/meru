# Factorio's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-factorio
  namespace: argocd
spec:
  description: "Factorio - factorio - Factorio (Space Age) server for Mario and friends, public UDP game port"
  sourceRepos:
    - https://git.clockmost.com/Meru/factorio.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: factorio
    - server: https://kubernetes.default.svc
      namespace: factorio-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: factorio }
    - { group: "", kind: Namespace, name: factorio-build }
