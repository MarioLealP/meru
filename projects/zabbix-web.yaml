# Zabbix-web's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-zabbix-web
  namespace: argocd
spec:
  description: "Zabbix-web - zabbix-web - the Zabbix web UI and API (SSO via Authentik)"
  sourceRepos:
    - https://git.clockmost.com/Meru/zabbix-web.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: zabbix-web
    - server: https://kubernetes.default.svc
      namespace: zabbix-web-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: zabbix-web }
    - { group: "", kind: Namespace, name: zabbix-web-build }
