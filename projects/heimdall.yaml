# Heimdall's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-heimdall
  namespace: argocd
spec:
  description: "Heimdall - Meru's scan worker - tells Thoth what really runs in the cluster"
  sourceRepos:
    - https://git.clockmost.com/Meru/heimdall.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: heimdall
    - server: https://kubernetes.default.svc
      namespace: heimdall-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: heimdall }
    - { group: "", kind: Namespace, name: heimdall-build }
