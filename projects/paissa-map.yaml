# Paissa-map's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-paissa-map
  namespace: argocd
spec:
  description: "Paissa-map - FFXIV housing - PaissaDB's open plots on the district maps"
  sourceRepos:
    - https://git.clockmost.com/Meru/paissa-map.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: paissa-map
    - server: https://kubernetes.default.svc
      namespace: paissa-map-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: paissa-map }
    - { group: "", kind: Namespace, name: paissa-map-build }
