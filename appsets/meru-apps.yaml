# Finds Meru apps: every repo in the Meru org (public or private - Argo reads with argocd/gitea-reader.yaml's login)
# with a deploy/meru.yaml gets one Application, app-<repo>, in its own fence meru-<repo> (projects/). A repo with the
# file but no fence deploys nothing. The namespace is always the repo's name. What the file holds: owner, chart (the
# nuwa-app release it was tested with), build (true: also its build namespace + Sindri runner) - all required - and
# optional buildLabels (extra runner labels -> the image their jobs run in, e.g. sindri-check for tests; never sindri
# itself: only its jobs get the build keys) and buildLimits (a bigger build than the 4Gi / 1h every app gets: memory
# 4-16Gi, timeout 1-3h - for compiles like felt-llm's CUDA llama.cpp; the build slots still cap it at two jobs at once).
# The app's database, if any, is meru-databases.yaml's. The app- prefix keeps a repo from taking over a platform
# Application of the same name (the controller adopts any unowned Application it generates the name of).
# Deletes (D86): Argo's default is to never delete a generated Application; this one opts in (applicationsSync: sync),
# so an app leaves Argo when its repo is archived or its marker parked (Shikigami's retire pass, D85). Deleting the
# Application never deletes what it runs (preserveResourcesOnDeletion) - Charon purges that later; a wrongly dropped
# app is regenerated by the next scan and takes its objects back. Gitea down = the scan fails before any delete.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: meru-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - scmProvider:
              cloneProtocol: https
              gitea:
                owner: Meru
                api: https://git.clockmost.com/
                tokenRef: { secretName: meru-gitea-scm, key: token } # private repos too (argocd/gitea-reader.yaml)
                excludeArchivedRepos: true # retired apps (D85) and hand-built leftovers (echo-by-hand)
              filters:
                - pathsExist: [deploy/meru.yaml]
              requeueAfterSeconds: 180
          - git:
              repoURL: "https://git.clockmost.com/Meru/{{ .repository }}.git"
              revision: "{{ .branch }}"
              files:
                - path: deploy/meru.yaml
  template:
    metadata:
      name: "app-{{ .repository }}"
      namespace: argocd
    spec:
      project: "meru-{{ .repository }}"
      sources: []
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .repository }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            app.kubernetes.io/part-of: meru
            meru.clockmost.com/app: "{{ .repository }}"
            meru.clockmost.com/owner: "{{ .owner }}"
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 10m }
  templatePatch: |
    spec:
      sources:
        - repoURL: https://git.clockmost.com/Meru/nuwa.git
          targetRevision: {{ .chart | quote }}
          path: charts/nuwa-app
          helm:
            releaseName: {{ .repository | quote }}
            valueFiles:
              - $app/deploy/values.yaml
        - repoURL: {{ printf "https://git.clockmost.com/Meru/%s.git" .repository | quote }}
          targetRevision: {{ .branch | quote }}
          ref: app
      {{- if .build }}
        - repoURL: https://git.clockmost.com/Meru/sindri.git
          targetRevision: sindri-build-0.5.0
          path: charts/sindri-build
          helm:
            releaseName: {{ printf "%s-build" .repository | quote }}
            valuesObject:
              app: {{ .repository | quote }}
              owner: {{ .owner | quote }}
            {{- if hasKey . "buildLabels" }}
            {{- if hasKey .buildLabels "sindri" }}{{ fail "deploy/meru.yaml: buildLabels may not redefine sindri" }}{{ end }}
              labels:
              {{- range $label, $image := .buildLabels }}
                {{ $label | quote }}: {{ $image | quote }}
              {{- end }}
            {{- end }}
            {{- if hasKey . "buildLimits" }}
            {{- $memory := get .buildLimits "memory" | default "4Gi" | toString }}
            {{- $timeout := get .buildLimits "timeout" | default "1h" | toString }}
            {{- if not (regexMatch "^([4-9]|1[0-6])Gi$" $memory) }}{{ fail "deploy/meru.yaml: buildLimits.memory must be 4Gi-16Gi" }}{{ end }}
            {{- if not (regexMatch "^[1-3]h$" $timeout) }}{{ fail "deploy/meru.yaml: buildLimits.timeout must be 1h-3h" }}{{ end }}
              buildMemoryLimit: {{ $memory | quote }}
              runner:
                timeout: {{ $timeout | quote }}
            {{- end }}
      {{- end }}
