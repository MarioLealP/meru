# Anubis's findings (D114, D115): each run writes what is stuck in Thoth into the ConfigMap anubis-findings in its own
# namespace, and Zabbix reads that one object - built as if Zabbix ran in k3s; today's Docker Zabbix reaches it with
# D108's zabbix-reader token. Anubis may create ConfigMaps only in its namespace (create can't be narrowed to a name)
# and change only that one; Zabbix may read only that one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anubis-writes-findings
  namespace: anubis
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [anubis-findings]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anubis-writes-findings
  namespace: anubis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anubis-writes-findings
subjects:
  - kind: ServiceAccount
    name: anubis
    namespace: anubis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zabbix-reads-anubis-findings
  namespace: anubis
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [anubis-findings]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zabbix-reads-anubis-findings
  namespace: anubis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zabbix-reads-anubis-findings
subjects:
  - kind: ServiceAccount
    name: zabbix
    namespace: zabbix-reader
