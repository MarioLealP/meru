# Felt-hermes's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-felt-hermes
  namespace: argocd
spec:
  description: "Felt-hermes - felt-hermes - Hermes Agent as Felt's secretary engine on felt-llm (spike), driven via herdr, no route"
  sourceRepos:
    - https://git.clockmost.com/Meru/felt-hermes.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: felt-hermes
    - server: https://kubernetes.default.svc
      namespace: felt-hermes-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: felt-hermes }
    - { group: "", kind: Namespace, name: felt-hermes-build }
