# Drive-rag's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-drive-rag
  namespace: argocd
spec:
  description: "Drive-rag - drive-rag - search over Mario's documents for Felt, answers worded by felt-llm, no route"
  sourceRepos:
    - https://git.clockmost.com/Meru/drive-rag.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: drive-rag
    - server: https://kubernetes.default.svc
      namespace: drive-rag-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: drive-rag }
    - { group: "", kind: Namespace, name: drive-rag-build }
