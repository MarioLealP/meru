# Gitea's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-gitea
  namespace: argocd
spec:
  description: "Gitea - gitea - our patched Gitea built from signed source as a signed host binary for Bahamut (nothing runs in k3s)"
  sourceRepos:
    - https://git.clockmost.com/Meru/gitea.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: gitea
    - server: https://kubernetes.default.svc
      namespace: gitea-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: gitea }
    - { group: "", kind: Namespace, name: gitea-build }
