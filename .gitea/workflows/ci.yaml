# Meru/meru's CI: scripts/check.sh - render the repo as Argo CD does, validate it, check every app fence - on every
# pull request and on main. It runs on this repo's check-only Sindri runner (namespace meru-build, sindri-build
# build: false, platform/meru-ci.yaml): the job has no service account token, no OpenBao login and no keys.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  KUSTOMIZE_VERSION: v5.8.3
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61

jobs:
  checks:
    runs-on: sindri-check # python 3.15 + uv + git (the runner's only label)
    env:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PYTHON_DOWNLOADS: never # the image's python only
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD" # the workspace volume isn't owned by the job's user
          git init --quiet .
          git remote add origin "https://sindri:${{ gitea.token }}@git.clockmost.com/${{ gitea.repository }}.git"
          git fetch --quiet --depth 1 origin "${{ gitea.ref }}" # a PR's commit lives under refs/pull/<n>/...
          git checkout --quiet -B work FETCH_HEAD

      - name: tools
        # Pinned by version and sha256; python's urllib, so the image needs no curl or wget.
        run: |
          mkdir -p /tmp/bin /tmp/dl
          fetch() { # url sha256 file
            python3 -I -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' "$1" "/tmp/dl/$3"
            echo "$2  /tmp/dl/$3" | sha256sum -c --quiet
            tar -xzf "/tmp/dl/$3" -C /tmp/dl
          }
          fetch "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" \
            "$KUBECONFORM_SHA256" kubeconform.tgz
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F$KUSTOMIZE_VERSION/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            "$KUSTOMIZE_SHA256" kustomize.tgz
          install -m 755 /tmp/dl/kubeconform /tmp/dl/kustomize /tmp/bin/

      - name: checks
        run: PATH=/tmp/bin:$PATH uv run --no-project --with pyyaml==6.0.3 bash scripts/check.sh
