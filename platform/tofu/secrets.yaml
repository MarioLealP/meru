# Every secret the runner uses, as a plain Kubernetes Secret made by ESO. The pod holds no OpenBao token and has no
# route to OpenBao: ESO (own namespace) logs in as SA eso, the pod only mounts the results.
#   gitea         username, password   the Gitea bot `tofu` (apps/meru/tofu/eso/gitea, set by setup-tofu.sh)
#   state-key     passphrase           the state encryption passphrase (apps/meru/tofu/eso/state-key)
#   registration  token                the runner's registration token, repo-scoped to Meru/tofu (apps/meru/tofu/eso/registration)
#   s3-tofu       ACCESS_KEY_ID, ACCESS_SECRET_KEY, REGION   the state bucket's Garage key, copied from namespace garage
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: meru
    meru.clockmost.com/owner: platform
spec:
  provider:
    vault:
      server: https://openbao.clockmost.internal:8204
      path: apps
      version: v2
      caBundle:  # the clockmost root CA (public)
      auth:
        kubernetes:
          mountPath: kubernetes
          role: meru-tofu-eso
          serviceAccountRef: { name: eso, audiences: [openbao] }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: garage-backup-key
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: meru
    meru.clockmost.com/owner: platform
spec:
  provider:
    kubernetes:
      remoteNamespace: garage
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt # the cluster's CA, in every namespace
          key: ca.crt
      auth:
        serviceAccount:
          name: backup-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: meru
    meru.clockmost.com/owner: platform
spec:
  refreshInterval: 5m
  secretStoreRef: { name: openbao, kind: SecretStore }
  target: { name: gitea, creationPolicy: Owner }
  dataFrom:
    - extract: { key: meru/tofu/eso/gitea }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: state-key
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: meru
    meru.clockmost.com/owner: platform
spec:
  refreshInterval: 5m
  secretStoreRef: { name: openbao, kind: SecretStore }
  target: { name: state-key, creationPolicy: Owner }
  dataFrom:
    - extract: { key: meru/tofu/eso/state-key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registration
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: meru
    meru.clockmost.com/owner: platform
spec:
  refreshInterval: 5m
  secretStoreRef: { name: openbao, kind: SecretStore }
  target: { name: registration, creationPolicy: Owner }
  dataFrom:
    - extract: { key: meru/tofu/eso/registration }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-tofu
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: meru
    meru.clockmost.com/owner: platform
spec:
  refreshInterval: 5m
  secretStoreRef: { name: garage-backup-key, kind: SecretStore }
  target: { name: s3-tofu, creationPolicy: Owner }
  dataFrom:
    - extract:
        key: s3-tofu # ACCESS_KEY_ID, ACCESS_SECRET_KEY, REGION (Garage's provisioner makes it; bucket pg-tofu)
