# Zabbix's read of the cluster (D108), for the server as a Meru app (Meru/zabbix, namespace zabbix): the same rights
# compose's Zabbix has through clockmost-infra ops/k3s/manifests/zabbix-reader.yaml, now for the app's own service
# account. It calls the API through a kubectl-proxy sidecar on its pod's projected token (10 minutes, renewed by the
# kubelet) - no long-lived token Secret, nothing copied into a Zabbix macro.
# - get + list CronJobs: each one's last successful run (ops/zabbix/zbx29).
# - list pods: containers stuck crash-looping or unable to pull their image (zbx34). A pod spec shows no secret values:
#   Meru charts take them by reference.
# No Secrets, no logs, no watch, no writes. The two report ConfigMaps (Anubis, Charon) are their own Roles, in
# rbac/anubis-findings.yaml and rbac/charon-sweep-report.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zabbix-reads-cluster
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zabbix-reads-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zabbix-reads-cluster
subjects:
  - kind: ServiceAccount
    name: zabbix
    namespace: zabbix
