# Thoth's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-thoth
  namespace: argocd
spec:
  description: Thoth - Meru's CMDB.
  sourceRepos:
    - https://git.clockmost.com/Meru/thoth.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: thoth
    - server: https://kubernetes.default.svc
      namespace: thoth-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: thoth }
    - { group: "", kind: Namespace, name: thoth-build }
