# Twitch-andre's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-twitch-andre
  namespace: argocd
spec:
  description: "Twitch-andre - Twitch Drops Miner - collects game drops for Andre's Twitch account"
  sourceRepos:
    - https://git.clockmost.com/Meru/twitch-andre.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: twitch-andre
    - server: https://kubernetes.default.svc
      namespace: twitch-andre-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: twitch-andre }
    - { group: "", kind: Namespace, name: twitch-andre-build }
