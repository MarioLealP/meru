# Temporal's database (Meru/temporal database/), its own app one wave before Temporal: the chart's schema job runs first in every Temporal
# sync, so the database has to exist already. It also creates the namespace (Pod Security restricted).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://git.clockmost.com/Meru/temporal.git # public; the LAN via cluster DNS
    targetRevision: main
    path: database
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        app.kubernetes.io/part-of: meru
        meru.clockmost.com/owner: platform
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
