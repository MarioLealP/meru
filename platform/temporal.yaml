# Temporal: the workflow engine behind Shikigami (workspace runbook clockmost-kubernetes.md D10). Temporal's own
# chart in its normal layout (frontend, history, matching, worker + the web UI), one replica each, on the CNPG
# database from temporal-db.yaml (wave 2). Admin tools off; the schema job (a Helm hook = an Argo PreSync hook)
# creates/updates the tables on every sync.
# Front door (D70): mutual TLS + Authentik tokens. Every certificate comes from OpenBao's pki_meru through
# cert-manager (D71) - the frontend only accepts clients holding one; the services talk to each other over TLS too
# (internode). On top, every call needs a token from Authentik's `temporal-oidc` provider (client_id temporal):
# its `temporal_permissions` claim (`<namespace>:<role>`, from temporal-* groups) decides what the caller may do.
# Temporal's own parts (worker service, namespace job) use the internal-frontend instead: internode mTLS, no token.
# So internode trusts its own CA, not pki_meru (D74): any Meru namespace can get a pki_meru cert for its own name,
# and with it would reach the internal-frontend - admin, no token - and history/matching directly.
# The web UI logs Mario in with that provider and passes his token on (D73, a WP-62 exception until 2027-04-30);
# its client secret comes from OpenBao through ESO. Renewals: the server re-reads its files (refreshInterval);
# the UI is rolled by Meru/kyverno's restart-on-secret-change (D72), for certificates and the secret alike.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://go.temporal.io/helm-charts
    chart: temporal
    targetRevision: 1.7.0
    helm:
      valuesObject:
        extraObjects:
          # cert-manager logs in to OpenBao as `certs` (shared role meru-certs): names under temporal.svc only.
          - |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: certs
              annotations: { argocd.argoproj.io/sync-wave: "-2" }
            automountServiceAccountToken: false
          - |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: cert-manager-certs-token
              annotations: { argocd.argoproj.io/sync-wave: "-2" }
            rules:
              - { apiGroups: [""], resources: [serviceaccounts/token], resourceNames: [certs], verbs: [create] }
          - |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: cert-manager-certs-token
              annotations: { argocd.argoproj.io/sync-wave: "-2" }
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: cert-manager-certs-token }
            subjects:
              - { kind: ServiceAccount, name: cert-manager, namespace: cert-manager }
          - |
            apiVersion: cert-manager.io/v1
            kind: Issuer
            metadata:
              name: openbao
              annotations: { argocd.argoproj.io/sync-wave: "-2" }
            spec:
              vault:
                server: https://openbao.clockmost.internal:8204
                path: pki_meru/sign/meru-ns
                # The clockmost root CA (public): OpenBao's listener certificate chains to it.
                caBundle: 
                auth:
                  kubernetes:
                    mountPath: /v1/auth/kubernetes
                    role: meru-certs
                    serviceAccountRef: { name: certs, audiences: [openbao] }
          # ESO logs in to OpenBao as `eso` (shared role meru-eso): reads apps/meru/temporal/eso/* only.
          - |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: eso
              annotations: { argocd.argoproj.io/sync-wave: "-2" }
            automountServiceAccountToken: false
          - |
            apiVersion: external-secrets.io/v1
            kind: SecretStore
            metadata:
              name: openbao
              annotations: { argocd.argoproj.io/sync-wave: "-2" }
            spec:
              provider:
                vault:
                  server: https://openbao.clockmost.internal:8204
                  path: apps
                  version: v2
                  # The clockmost root CA (public), as in the Issuer above.
                  caBundle: 
                  auth:
                    kubernetes:
                      mountPath: kubernetes
                      role: meru-eso
                      serviceAccountRef: { name: eso, audiences: [openbao] }
          # The UI's OIDC client secret (written by meru-oidc-secret.sh from Authentik's generated one).
          - |
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: temporal-ui-oidc
              annotations: { argocd.argoproj.io/sync-wave: "-1" }
            spec:
              refreshInterval: 5m
              secretStoreRef: { name: openbao, kind: SecretStore }
              target: { name: temporal-ui-oidc, creationPolicy: Owner }
              dataFrom:
                - extract: { key: meru/temporal/eso/temporal-ui-oidc }
          # Internode's own CA (D74): its key lives only in this namespace (temporal-internode-ca, encrypted at rest),
          # cert-manager renews it. 10 years; when it does renew, every server must restart within the hour (they
          # re-read files hourly, and old and new would not trust each other meanwhile).
          - |
            apiVersion: cert-manager.io/v1
            kind: Issuer
            metadata:
              name: selfsigned
              annotations: { argocd.argoproj.io/sync-wave: "-4" }
            spec:
              selfSigned: {}
          - |
            apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: temporal-internode-ca
              annotations: { argocd.argoproj.io/sync-wave: "-3" }
            spec:
              isCA: true
              commonName: temporal internode CA
              secretName: temporal-internode-ca
              duration: 87600h
              privateKey: { algorithm: ECDSA, size: 384 }
              issuerRef: { name: selfsigned, kind: Issuer }
          - |
            apiVersion: cert-manager.io/v1
            kind: Issuer
            metadata:
              name: temporal-internode
              annotations: { argocd.argoproj.io/sync-wave: "-2" }
            spec:
              ca:
                secretName: temporal-internode-ca
          # The services among themselves (history, matching, worker, frontend, internal-frontend).
          - |
            apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: temporal-internode
              annotations: { argocd.argoproj.io/sync-wave: "-1" }
            spec:
              secretName: temporal-internode-tls
              dnsNames: [internode.temporal.svc]
              duration: 24h
              renewBefore: 8h
              privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
              usages: [server auth, client auth, digital signature]
              issuerRef: { name: temporal-internode, kind: Issuer }
          - |
            apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: temporal-frontend
              annotations: { argocd.argoproj.io/sync-wave: "-1" }
            spec:
              secretName: temporal-frontend-tls
              dnsNames: [temporal-frontend.temporal.svc, temporal-frontend.temporal.svc.cluster.local]
              duration: 24h
              renewBefore: 8h
              privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
              usages: [server auth, client auth, digital signature]
              issuerRef: { name: openbao, kind: Issuer }
          # The web UI's client certificate to the frontend.
          - |
            apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: temporal-web
              annotations: { argocd.argoproj.io/sync-wave: "-1" }
            spec:
              secretName: temporal-web-tls
              dnsNames: [temporal-web.temporal.svc]
              duration: 24h
              renewBefore: 8h
              privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
              usages: [client auth, digital signature]
              issuerRef: { name: openbao, kind: Issuer }
        # The chart sets app.kubernetes.io/part-of: temporal itself (the namespace carries part-of: meru).
        additionalLabels:
          meru.clockmost.com/owner: platform
        server:
          image:
            repository: docker.io/temporalio/server
            tag: 1.32.1@sha256:acecbab5b0b8ae9cf4012b508866ca97feda3709577bf157b537239f40029049
          securityContext: &pod
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 512Mi }
          # The server re-reads its certificate files (refreshInterval below), so a renewal needs no restart:
          # Meru/kyverno's restart-on-secret-change skips these (D72). The UI can't, so it isn't annotated.
          deploymentAnnotations:
            meru.clockmost.com/reloads-secrets: "true"
          # The frontend fetches Authentik's signing keys once at start and then only every refreshInterval - a
          # failed first fetch isn't retried sooner, and an unknown key ID doesn't trigger one. After the 2026-10-31
          # boot it started before Caddy listened and refused every token for an hour. So the frontend waits until
          # the keys answer (backing off to a minute). The chart gives every server service these init containers;
          # history, matching and the worker never call Authentik, so for them it's a no-op.
          additionalInitContainers:
            - name: wait-for-authentik
              image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              env:
                - name: COMPONENT
                  valueFrom: { fieldRef: { fieldPath: "metadata.labels['app.kubernetes.io/component']" } }
                - { name: JWKS, value: https://auth.clockmost.com/application/o/temporal-oidc/jwks/ }
              command:
                - sh
                - -c
                - |
                  [ "$COMPONENT" = frontend ] || exit 0
                  delay=2
                  until curl -fsS --max-time 10 "$JWKS" | grep -q '"kid"'; do
                    echo "Authentik's keys not reachable yet, retrying in ${delay}s"
                    sleep "$delay"
                    delay=$((delay * 2 > 60 ? 60 : delay * 2))
                  done
                  echo "Authentik's keys reachable"
              securityContext:
                runAsNonRoot: true
                runAsUser: 100 # curl_user in the image
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 5m, memory: 8Mi }
                limits: { memory: 32Mi }
          tls:
            internode:
              enabled: true
              secretName: temporal-internode-tls
              serverName: internode.temporal.svc
              requireClientAuth: true
            frontend:
              enabled: true
              secretName: temporal-frontend-tls
              serverName: temporal-frontend.temporal.svc
              requireClientAuth: true # mTLS: no certificate from pki_meru, no connection
          config:
            logLevel: info
            # Every call to the frontend needs an Authentik token (except health checks + GetSystemInfo).
            authorization:
              jwtKeyProvider:
                keySourceURIs: [https://auth.clockmost.com/application/o/temporal-oidc/jwks/]
                # Only for key rotations: the one fetch at start is made safe by wait-for-authentik above.
                refreshInterval: 1h
              permissionsClaimName: temporal_permissions
              audience: temporal # only tokens minted for Temporal - not Thoth's or anyone else's
              authorizer: default
              claimMapper: default
            tls:
              refreshInterval: 1h # re-read the certificate files, so renewals need no restart
            persistence:
              # Can never change after the first install. 512 is sized for big clusters; 8 is plenty here.
              numHistoryShards: 8
              datastores:
                default:
                  sql: &sql
                    pluginName: postgres12_pgx
                    driverName: postgres12_pgx
                    databaseName: temporal
                    connectAddr: temporal-db-rw.temporal.svc.cluster.local:5432
                    connectProtocol: tcp
                    user: temporal
                    existingSecret: temporal-db-app # written by CNPG
                    secretKey: password
                    maxConns: 10
                    maxIdleConns: 5
                    maxConnLifetime: 1h
                    createDatabase: false # CNPG made both databases
                    manageSchema: true
                visibility:
                  sql:
                    <<: *sql
                    databaseName: temporal_visibility
            namespaces:
              create: true
              namespace:
                - name: meru # Shikigami's workflows
                  retention: 30d
          frontend: { containerSecurityContext: &container { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } } }
          history: { containerSecurityContext: *container }
          matching: { containerSecurityContext: *container }
          worker:
            containerSecurityContext: *container
            # The chart gives the worker no probes (it has no rpc port); its membership port is up when it is.
            livenessProbe: { initialDelaySeconds: 150, tcpSocket: { port: membership } }
            readinessProbe: { tcpSocket: { port: membership } }
          # Temporal's own parts call this one instead of the frontend: internode mTLS, no authorizer, so no token.
          internal-frontend:
            enabled: true
            containerSecurityContext: *container
        admintools:
          enabled: false
          image:
            repository: docker.io/temporalio/admin-tools
            tag: 1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83 # also runs the schema + namespace jobs
        schema:
          securityContext: *pod
          containerSecurityContext: *container
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
        web:
          tls:
            enabled: true
            secretName: temporal-web-tls
            serverName: temporal-frontend.temporal.svc
            enableHostVerification: true
          # Mario logs in through Authentik (D73); the forward-auth gate in Caddy stays in front. The access token
          # (10 min) is renewed from the refresh token in an HttpOnly cookie, for up to 12 h.
          additionalEnv:
            - { name: TEMPORAL_AUTH_ENABLED, value: "true" }
            - { name: TEMPORAL_AUTH_REDIRECT_TO_PROVIDER, value: "true" }
            - { name: TEMPORAL_AUTH_PROVIDER_URL, value: https://auth.clockmost.com/application/o/temporal-oidc/ }
            - { name: TEMPORAL_AUTH_CLIENT_ID, value: temporal }
            - name: TEMPORAL_AUTH_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: temporal-ui-oidc, key: clientSecret } }
            - { name: TEMPORAL_AUTH_CALLBACK_URL, value: https://temporal.clockmost.com/auth/sso/callback }
            - { name: TEMPORAL_AUTH_SCOPES, value: "openid,profile,email,temporal,offline_access" }
            - { name: TEMPORAL_AUTH_REFRESH_TOKEN_DURATION, value: 12h }
            - { name: TEMPORAL_MAX_SESSION_DURATION, value: 12h }
          image:
            repository: docker.io/temporalio/ui
            tag: 2.57.0@sha256:d944f959d0923c35cd991a17a0edbe087770eff843724b181933e0cfdd563ab2
          securityContext: *pod
          containerSecurityContext: *container
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
