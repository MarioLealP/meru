# Cloudflared's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-cloudflared
  namespace: argocd
spec:
  description: "Cloudflared - cloudflared - the Cloudflare Tunnel, the only internet path in, to Caddy"
  sourceRepos:
    - https://git.clockmost.com/Meru/cloudflared.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cloudflared
    - server: https://kubernetes.default.svc
      namespace: cloudflared-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: cloudflared }
    - { group: "", kind: Namespace, name: cloudflared-build }
