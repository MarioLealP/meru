# Janus's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-janus
  namespace: argocd
spec:
  description: "Janus - Meru's front door - takes requests from the atlas and agents, hands approvals to Xolotl"
  sourceRepos:
    - https://git.clockmost.com/Meru/janus.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: janus
    - server: https://kubernetes.default.svc
      namespace: janus-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: janus }
    - { group: "", kind: Namespace, name: janus-build }
