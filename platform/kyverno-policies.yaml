# Meru's compliance rules for every workload namespace (Meru/kyverno cluster/ - not that repo's root, which
# meru-kyverno applies). Wave -1: after Kyverno, before any workload.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://git.clockmost.com/Meru/kyverno.git # public; the LAN via cluster DNS
    targetRevision: main
    path: cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry: # Kyverno's CRDs may not exist yet on the first pass
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
