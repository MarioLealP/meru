# Rancher: the cluster console (D130, workspace runbook clockmost-kubernetes.md) - logs, shells, restarts, a view of
# everything - at https://rancher.clockmost.com, LAN + VPN only (host Caddy terminates TLS, no ingress here).
# Argo CD stays the only deployer: nobody edits live objects in Rancher, and its Fleet GitOps menu is off.
#
# Login: Authentik's `rancher` OIDC client (Meru/authentik blueprints/rancher.yaml), clockmost-admins only (Mario).
# Its client secret is Authentik's own, copied to OpenBao apps/meru/cattle-system/eso/rancher-oidc by
# meru-oidc-secret.sh (admin session) and brought here by ESO; Rancher reads auth secrets only from its own cattle-global-data (any other `ns:name` is taken
# as the literal secret), so a second ExternalSecret copies it there through a store that may read just that one Secret.
# The login gets the `clockmost-operator` role on the local cluster: read (no Secrets - their values would sit in
# browser JS), pod logs + shell, delete pods, restart workloads. Nothing else.
# Break-glass: Rancher's local `admin` (full rights). Its first password is the random one Rancher writes to
# cattle-system/bootstrap-secret at first start (bootstrapPassword stays empty: nothing in git); changed on first
# login, kept in KeePass.
#
# Rancher runs as root and spawns its own parts (Fleet, its webhook, Turtles/CAPI) into namespaces it makes itself
# (cattle-*, fleet-*, local, p-*), images by tag - outside the house rules on purpose (D130). Its webhook guards
# Pod Security labels on namespaces; Argo's controller has `*` and passes. cattle-system is privileged (below). Removal = rancher-cleanup (D130 notes),
# etcd snapshot first. Measured ~2.1 GB RAM (2026-11-15 load test).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://releases.rancher.com/server-charts/stable
    chart: rancher
    targetRevision: 2.15.3 # latest (2026-10-29); supports k3s v1.36.5 (its default)
    helm:
      releaseName: rancher
      valuesObject:
        hostname: rancher.clockmost.com
        ingress:
          enabled: false # host Caddy routes to the rancher Service
        tls: external
        agentTLSMode: system-store # Caddy serves the public wildcard cert
        replicas: 1
        rancherImageTag: v2.15.3@sha256:3f3a50c6e49c1cf5b4673bef236e0f260f36055de4d073438e38c441dc97aa9b
        resources:
          requests: { cpu: 100m, memory: 1Gi }
          limits: { memory: 2Gi }
        # Fleet itself can't be turned off; this only drops gitjob + the Continuous Delivery menu (D130).
        features: continuous-delivery=false
        postDelete:
          image:
            tag: v0.8.3@sha256:abb0804d239cae9c137347b0c1175e745ab791d60023ae619f6aa6465fb2da7c
        preUpgrade:
          image:
            tag: v0.8.3@sha256:abb0804d239cae9c137347b0c1175e745ab791d60023ae619f6aa6465fb2da7c
        extraObjects:
          # ESO logs in to OpenBao as `eso` (shared role meru-eso): reads apps/meru/cattle-system/eso/* only.
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: eso
              annotations: { argocd.argoproj.io/sync-wave: "-2" }
            automountServiceAccountToken: false
          - apiVersion: external-secrets.io/v1
            kind: SecretStore
            metadata:
              name: openbao
              annotations: { argocd.argoproj.io/sync-wave: "-2" }
            spec:
              provider:
                vault:
                  server: https://openbao.clockmost.internal:8204
                  path: apps
                  version: v2
                  # The clockmost root CA (public): OpenBao's listener certificate chains to it.
                  caBundle: 
                  auth:
                    kubernetes:
                      mountPath: kubernetes
                      role: meru-eso
                      serviceAccountRef: { name: eso, audiences: [openbao] }
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: rancher-oidc
              annotations: { argocd.argoproj.io/sync-wave: "-1" }
            spec:
              refreshInterval: 5m
              secretStoreRef: { name: openbao, kind: SecretStore }
              target: { name: rancher-oidc, creationPolicy: Owner }
              dataFrom:
                - extract: { key: meru/cattle-system/eso/rancher-oidc }
          # The copy into cattle-global-data (Rancher makes that namespace; wave 4, after Rancher is up). ESO's
          # kubernetes provider, as `rancher-oidc-copier`: may get/list/watch the one Secret rancher-oidc in
          # cattle-system and nothing else. No OpenBao login for cattle-global-data (it holds Rancher's other secrets).
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: rancher-oidc-copier
              namespace: cattle-global-data
              annotations: &copy
                argocd.argoproj.io/sync-wave: "4"
            automountServiceAccountToken: false
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: rancher-oidc-copier
              annotations: *copy
            rules:
              - apiGroups: [""]
                resources: [secrets]
                resourceNames: [rancher-oidc]
                verbs: [get, list, watch]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: rancher-oidc-copier
              annotations: *copy
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: rancher-oidc-copier }
            subjects:
              - { kind: ServiceAccount, name: rancher-oidc-copier, namespace: cattle-global-data }
          - apiVersion: external-secrets.io/v1
            kind: SecretStore
            metadata:
              name: cattle-system
              namespace: cattle-global-data
              annotations: *copy
            spec:
              provider:
                kubernetes:
                  remoteNamespace: cattle-system
                  server:
                    url: https://kubernetes.default.svc
                    caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
                  auth:
                    serviceAccount: { name: rancher-oidc-copier }
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: rancher-oidc
              namespace: cattle-global-data
              annotations:
                argocd.argoproj.io/sync-wave: "5"
            spec:
              refreshInterval: 5m
              secretStoreRef: { name: cattle-system, kind: SecretStore }
              target: { name: rancher-oidc, creationPolicy: Owner }
              dataFrom:
                - extract: { key: rancher-oidc }
          # Rancher's own objects: their CRDs exist only once Rancher has started, so they come last (wave 5, after
          # the Deployment is healthy) and skip the dry run on the first sync.
          - apiVersion: management.cattle.io/v3
            kind: Setting
            metadata:
              name: server-url
              annotations: &cattle
                argocd.argoproj.io/sync-wave: "5"
                argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
            value: https://rancher.clockmost.com
          - apiVersion: management.cattle.io/v3
            kind: Setting
            metadata:
              name: telemetry-opt
              annotations: *cattle
            value: out
          # The login itself (what Rancher's UI "Auth Provider > Generic OIDC" would write). Only clockmost-admins
          # may log in (accessMode restricted); the `groups` claim comes from Authentik's clockmost-scope-groups.
          - apiVersion: management.cattle.io/v3
            kind: AuthConfig
            metadata:
              name: genericoidc
              annotations: *cattle
            type: genericOIDCConfig
            enabled: true
            accessMode: restricted
            allowedPrincipalIds:
              - genericoidc_group://clockmost-admins
            clientId: rancher
            clientSecret: cattle-global-data:rancher-oidc
            issuer: https://auth.clockmost.com/application/o/rancher/
            rancherUrl: https://rancher.clockmost.com/verify-auth
            scope: openid profile email groups
            groupsClaim: groups
            groupSearchEnabled: false
          # Everyone who logs in is a plain Rancher user ...
          - apiVersion: management.cattle.io/v3
            kind: GlobalRoleBinding
            metadata:
              name: clockmost-admins-user
              annotations: *cattle
            globalRoleName: user-base
            groupPrincipalName: genericoidc_group://clockmost-admins
          # ... with this role on the local cluster (D130: read + restart + shell; Argo deploys, nobody edits live).
          - apiVersion: management.cattle.io/v3
            kind: RoleTemplate
            metadata:
              name: clockmost-operator
              annotations: *cattle
            displayName: clockmost operator
            description: Read everything but Secrets, pod logs and shells, delete pods, restart workloads (D130).
            context: cluster
            rules:
              - apiGroups: [""]
                resources:
                  - pods
                  - pods/log
                  - services
                  - endpoints
                  - configmaps
                  - events
                  - namespaces
                  - nodes
                  - persistentvolumes
                  - persistentvolumeclaims
                  - serviceaccounts
                  - resourcequotas
                  - limitranges
                  - replicationcontrollers
                verbs: [get, list, watch]
              - apiGroups:
                  - apps
                  - batch
                  - autoscaling
                  - policy
                  - networking.k8s.io
                  - discovery.k8s.io
                  - storage.k8s.io
                  - events.k8s.io
                  - metrics.k8s.io
                  - rbac.authorization.k8s.io
                  - apiextensions.k8s.io
                  - argoproj.io
                  - postgresql.cnpg.io
                  - external-secrets.io
                  - cert-manager.io
                  - keda.sh
                resources: ["*"]
                verbs: [get, list, watch]
              - apiGroups: [""]
                resources: [pods/exec]
                verbs: [create, get]
              - apiGroups: [""]
                resources: [pods]
                verbs: [delete]
              - apiGroups: [apps]
                resources: [deployments, statefulsets, daemonsets]
                verbs: [patch] # rollout restart
          - apiVersion: management.cattle.io/v3
            kind: ClusterRoleTemplateBinding
            metadata:
              name: clockmost-admins-operator
              namespace: local
              annotations: *cattle
            clusterName: local
            roleTemplateName: clockmost-operator
            groupPrincipalName: genericoidc_group://clockmost-admins
          # Rancher projects = themes (Mario 2026-11-15: "just make part of the caas process, a theme field"). Rancher has
          # one level only, so a theme is a project and the app's namespaces sit in it side by side (immich, immich-build,
          # its environments). Which theme: the request's spec.theme, which Shikigami writes onto every one of the app's
          # namespaces as the annotation meru.clockmost.com/theme (default unsorted); an app namespace without one ->
          # unsorted. Rancher's and Kubernetes' own namespaces (kube-*, cattle-*, fleet-*, default, local*, Rancher's
          # project/user ones p-*, u-*, user-*) stay where Rancher puts them; every other namespace is a platform part ->
          # platform (the owner=platform label only lands on namespaces Argo creates, so it can't be the rule). The
          # sorter makes a theme's project the first time one is asked for; an emptied project stays until deleted.
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: rancher-themes
              annotations: &themes
                argocd.argoproj.io/sync-wave: "6"
            data:
              sort.sh: |
                set -eu
                kubectl get ns -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.labels.meru\.clockmost\.com/app}{"|"}{.metadata.annotations.meru\.clockmost\.com/theme}{"|"}{.metadata.annotations.field\.cattle\.io/projectId}{"\n"}{end}' |
                while IFS='|' read -r ns app theme current; do
                  if [ -z "$theme" ]; then
                    if [ -n "$app" ]; then theme=unsorted
                    else
                      case "$ns" in
                        kube-* | cattle-* | fleet-* | cluster-fleet-* | default | local | local-* | p-* | u-* | user-*) continue ;;
                      esac
                      theme=platform
                    fi
                  fi
                  [ "$current" = "local:$theme" ] && continue
                  if ! kubectl get projects.management.cattle.io -n local "$theme" >/dev/null 2>&1; then
                    name=$(echo "$theme" | tr - ' ' | awk '{print toupper(substr($0, 1, 1)) substr($0, 2)}')
                    printf '%s\n' "apiVersion: management.cattle.io/v3" "kind: Project" \
                      "metadata: {name: $theme, namespace: local, annotations: {field.cattle.io/no-creator-rbac: 'true'}}" \
                      "spec: {clusterName: local, displayName: '$name'}" | kubectl create -f - >/dev/null
                    echo "project $theme ($name) made"
                  fi
                  kubectl annotate ns "$ns" "field.cattle.io/projectId=local:$theme" --overwrite >/dev/null
                  echo "$ns -> $theme"
                done
          # The sorter: every 5 min, files namespaces into their theme's project. May read and annotate namespaces, and
          # make and fill projects (manage-namespaces, checked by rancher-webhook) - nothing else. No resourceNames:
          # themes come from requests, so the projects aren't known up front.
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: rancher-themes
              annotations: *themes
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: rancher-themes
              annotations: *themes
            rules:
              - apiGroups: [""]
                resources: [namespaces]
                verbs: [get, list, patch]
              - apiGroups: [management.cattle.io]
                resources: [projects]
                verbs: [get, create, manage-namespaces]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: rancher-themes
              annotations: *themes
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rancher-themes }
            subjects:
              - { kind: ServiceAccount, name: rancher-themes, namespace: cattle-system }
          - apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: rancher-themes
              annotations: *themes
            spec:
              schedule: "*/5 * * * *"
              concurrencyPolicy: Forbid
              successfulJobsHistoryLimit: 1
              failedJobsHistoryLimit: 1
              jobTemplate:
                spec:
                  backoffLimit: 0
                  activeDeadlineSeconds: 120
                  ttlSecondsAfterFinished: 600
                  template:
                    metadata:
                      labels:
                        app.kubernetes.io/part-of: meru
                        meru.clockmost.com/owner: platform
                    spec:
                      serviceAccountName: rancher-themes
                      restartPolicy: Never
                      securityContext:
                        runAsNonRoot: true
                        runAsUser: 1000
                        seccompProfile: { type: RuntimeDefault }
                      containers:
                        - name: sort
                          image: docker.io/rancher/shell:v0.8.3@sha256:abb0804d239cae9c137347b0c1175e745ab791d60023ae619f6aa6465fb2da7c
                          command: [sh, /config/sort.sh]
                          securityContext:
                            allowPrivilegeEscalation: false
                            readOnlyRootFilesystem: true
                            capabilities: { drop: [ALL] }
                          resources:
                            requests: { cpu: 10m, memory: 32Mi }
                            limits: { memory: 128Mi }
                          volumeMounts:
                            - { name: config, mountPath: /config }
                      volumes:
                        - name: config
                          configMap: { name: rancher-themes }
  destination:
    server: https://kubernetes.default.svc
    namespace: cattle-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # privileged: Rancher runs as root, and the system-upgrade-controller it installs here mounts host paths
        # (/etc/ssl, /etc/pki). Under baseline that pod never started and Rancher retried the install every few
        # seconds, leaving a failed pod each time - 61 of them filled the node's 200-pod limit (2026-11-15).
        # Nothing new for Rancher: it already holds cluster-admin.
        pod-security.kubernetes.io/enforce: privileged
        # OpenBao's shared meru-eso login admits only namespaces labelled part-of=meru (D71).
        app.kubernetes.io/part-of: meru
        meru.clockmost.com/owner: platform
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
  # Rancher writes its own labels/annotations onto objects it manages; the AuthConfig/Settings carry fields Rancher
  # fills in (status, default, creatorId) - SSA only claims what's listed above.
