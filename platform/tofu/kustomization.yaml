apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tofu
resources:
  - serviceaccounts.yaml
  - secrets.yaml
  - deployment.yaml
  - networkpolicy.yaml
# The runner's config as a generated ConfigMap: its name carries a hash of config.yaml, so a change to the file renames
# the ConfigMap and the Deployment (which names it) rolls. The runner reads its config once, at start.
configMapGenerator:
  - name: tofu-runner-config
    files:
      - config.yaml
    options:
      labels:
        app.kubernetes.io/name: tofu-runner
        app.kubernetes.io/part-of: meru
        meru.clockmost.com/owner: platform
