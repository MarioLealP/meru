# Shikigami's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-shikigami
  namespace: argocd
spec:
  description: Shikigami - Meru's orchestrator.
  sourceRepos:
    - https://git.clockmost.com/Meru/shikigami.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: shikigami
    - server: https://kubernetes.default.svc
      namespace: shikigami-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: shikigami }
    - { group: "", kind: Namespace, name: shikigami-build }
