# Agents's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-agents
  namespace: argocd
spec:
  description: "Agents - herdr-core + AI coding agents (Claude Code personal + enterprise), reached over SSH from any device"
  sourceRepos:
    - https://git.clockmost.com/Meru/agents.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: agents
    - server: https://kubernetes.default.svc
      namespace: agents-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: agents }
    - { group: "", kind: Namespace, name: agents-build }
