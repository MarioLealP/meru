# Onlyoffice's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-onlyoffice
  namespace: argocd
spec:
  description: "Onlyoffice - onlyoffice - Word, Excel and PowerPoint editing in the browser, for Nextcloud"
  sourceRepos:
    - https://git.clockmost.com/Meru/onlyoffice.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: onlyoffice
    - server: https://kubernetes.default.svc
      namespace: onlyoffice-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: onlyoffice }
    - { group: "", kind: Namespace, name: onlyoffice-build }
