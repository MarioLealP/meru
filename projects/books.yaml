# Books's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-books
  namespace: argocd
spec:
  description: "Books - books - ebook library (Calibre-Web-Automated) with OPDS + reading sync for the Bigme B6"
  sourceRepos:
    - https://git.clockmost.com/Meru/books.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: books
    - server: https://kubernetes.default.svc
      namespace: books-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: books }
    - { group: "", kind: Namespace, name: books-build }
