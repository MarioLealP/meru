# Felt-vision's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-felt-vision
  namespace: argocd
spec:
  description: "Felt-vision - felt-vision - Felt's screenshot describer (Qwen3-VL-2B on llama.cpp, GPU), no route"
  sourceRepos:
    - https://git.clockmost.com/Meru/felt-vision.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: felt-vision
    - server: https://kubernetes.default.svc
      namespace: felt-vision-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: felt-vision }
    - { group: "", kind: Namespace, name: felt-vision-build }
