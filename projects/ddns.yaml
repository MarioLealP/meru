# Ddns's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-ddns
  namespace: argocd
spec:
  description: "Ddns - ddns - keeps headscale/terraria DNS records on the home's public IP (Cloudflare)"
  sourceRepos:
    - https://git.clockmost.com/Meru/ddns.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ddns
    - server: https://kubernetes.default.svc
      namespace: ddns-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: ddns }
    - { group: "", kind: Namespace, name: ddns-build }
