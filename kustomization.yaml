# Everything Argo CD applies from this repo (namespace argocd). One fence file per app under projects/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - projects/platform.yaml
  - projects/echo.yaml
  - projects/thoth.yaml
  - projects/shikigami.yaml
  - projects/xolotl.yaml
  - projects/atlas.yaml
  - projects/janus.yaml
  - projects/heimdall.yaml
  - projects/charon.yaml
  - projects/warpgate.yaml
  - projects/anubis.yaml
  - projects/glitchtip.yaml
  - projects/paissa-map.yaml
  - projects/herosiege-filter.yaml
  - projects/twitch-mira.yaml
  - projects/twitch-andre.yaml
  - projects/twitch-mario.yaml
  - projects/twitch-robin.yaml
  - projects/twitch-kuri.yaml
  - projects/whoami.yaml
  - projects/ntfy.yaml
  - projects/obsidian.yaml
  - projects/searxng.yaml
  - projects/felt-vision.yaml
  - projects/felt-llm.yaml
  - projects/felt-voice.yaml
  - projects/poe2rag.yaml
  - projects/felt-app.yaml
  - projects/drive-rag.yaml
  - projects/felt-core.yaml
  - projects/nova-lemuria.yaml
  - projects/ddns.yaml
  - projects/factorio.yaml
  - projects/terraria.yaml
  - projects/mainsail.yaml
  - projects/ender.yaml
  - projects/immich-ml.yaml
  - projects/immich.yaml
  - appsets/meru-apps.yaml
  - appsets/meru-databases.yaml
  - appsets/meru-envs.yaml
  # Argo's read-only Gitea login (private Meru repos, cm-8ope).
  - argocd/gitea-reader.yaml
  # Workload identities' rights - each one exact, with its reason.
  - rbac/shikigami-reads-apps.yaml
  - rbac/heimdall-reads-cluster.yaml
  - rbac/shikigami-marks-retired.yaml
  - rbac/charon-deletes-retired.yaml
  - rbac/charon-reads-apps.yaml
  - rbac/charon-releases-volumes.yaml
  - rbac/charon-sweep-report.yaml
  - rbac/anubis-findings.yaml
  - rbac/anubis-checks.yaml
  # The platform's parts - an explicit list, never discovered: each one has cluster-wide power.
  - platform/cert-manager.yaml
  - platform/cnpg.yaml
  - platform/device-plugin.yaml
  - platform/eso.yaml
  - platform/falco.yaml
  - platform/keda.yaml
  - platform/kyverno.yaml
  - platform/kyverno-policies.yaml
  - platform/meru-kyverno.yaml
  - platform/temporal.yaml
  - platform/temporal-db.yaml
  - platform/zot.yaml
patches:
  # Every app fence gets the same list of object kinds, kept in one place.
  - path: projects/app-kinds.yaml
    target:
      group: argoproj.io
      kind: AppProject
      name: meru-.*
