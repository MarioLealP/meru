# Kyverno: admission policy engine (workspace runbook clockmost-kubernetes.md D27). Wave -2: before its policies.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.2 # Kyverno v1.19.2
    helm:
      valuesObject:
        kyverno-api:
          # The subchart renders its CRDs with `labels: {}` and `annotations: {}`, which the API server drops -
          # Argo then shows them OutOfSync forever. One entry in each makes the maps non-empty.
          labels:
            app.kubernetes.io/part-of: kyverno
          annotations:
            meru.clockmost.com/owner: platform
        config:
          webhooks:
            # The platform exemptions, in one place: pieces installed before the rules existed.
            # Kyverno's own namespace is excluded by the chart (excludeKyvernoNamespace).
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values: [kube-system, kube-public, kube-node-lease, argocd, local-path-storage]
        features:
          policyExceptions:
            enabled: true
            namespace: kyverno # per-workload exceptions live here, in git (k8s/kyverno-policies/exceptions)
        admissionController:
          replicas: 1
        backgroundController:
          enabled: true # D72: runs Meru/kyverno's restart-on-secret-change (mutate-existing)
          rbac:
            # Only what that rule needs: roll Deployments. The chart's default extras (create/delete roles,
            # rolebindings, network policies, configmaps...) are for generate rules, which we don't have.
            coreClusterRole:
              extraResources: []
            clusterRole:
              extraResources:
                - apiGroups: [apps]
                  resources: [deployments]
                  verbs: [get, list, watch, update, patch]
          resources:
            # 128Mi was too tight once restart-on-secret-change had a backlog (49 pending UpdateRequests,
            # 2026-11-13): OOMKilled 78 times, and in between Go's GC spun at ~110/128Mi burning 6-8 cores -
            # the whole server slowed (Gitea timeouts, load 35). Memory headroom + a CPU cap so it can't do
            # that again; GOMEMLIMIT below the limit makes the GC give way before the OOM killer acts.
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          extraEnvVars:
            - name: GOMEMLIMIT
              value: 450MiB
        cleanupController:
          enabled: false # no cleanup policies
        reportsController:
          enabled: true # policy reports: what passes/fails, also for things already running
          # The chart's 128Mi limit was too tight: by 2026-11-08 the controller had hit it 3.3M times. At its
          # limit the kernel drops the controller's own code pages and reads them back from disk - 3.4 GB of
          # reads in 5 s - which, with builds swapping, starved etcd and k3s restarted.
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Kyverno's CRDs are too big for client-side apply
