# Heimdall may list what runs in the cluster (D100/D101): every namespace (Meru apps are the labelled ones) and every
# Deployment, StatefulSet, DaemonSet and CronJob (D117: a CronJob app - Charon, Anubis - has no Deployment), which it
# reports to Thoth as k8s-scan@clockmost every 5 minutes. List only: no get, no watch, no writes, and nothing that
# holds values - no Secrets, ConfigMaps or pods. Cluster-wide on purpose: a scan is a snapshot of the whole cluster,
# platform included.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heimdall-reads-cluster
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heimdall-reads-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: heimdall-reads-cluster
subjects:
  - kind: ServiceAccount
    name: heimdall
    namespace: heimdall
