# Felt-llm's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-felt-llm
  namespace: argocd
spec:
  description: "Felt-llm - felt-llm - Felt's LLM (Bonsai 2 27B on Prism's llama.cpp fork, GPU), no route"
  sourceRepos:
    - https://git.clockmost.com/Meru/felt-llm.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: felt-llm
    - server: https://kubernetes.default.svc
      namespace: felt-llm-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: felt-llm }
    - { group: "", kind: Namespace, name: felt-llm-build }
