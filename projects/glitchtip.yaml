# Glitchtip's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its two namespaces, which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-glitchtip
  namespace: argocd
spec:
  description: "Glitchtip - Error tracking - apps report their crashes here (Sentry-compatible)"
  sourceRepos:
    - https://git.clockmost.com/Meru/glitchtip.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: glitchtip
    - server: https://kubernetes.default.svc
      namespace: glitchtip-build
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: glitchtip }
    - { group: "", kind: Namespace, name: glitchtip-build }
